# One-off / manual VPS ops via the same SSH secrets as Deploy.
# Does not overwrite .env. Keep COLLECT_ENABLED=false in .env; one-shot collect runs in-container only.
name: Ops VPS

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Preset op to run"
        required: true
        type: choice
        options:
          - diagnose
          - collect-valorant
          - diagnose-and-collect-valorant
          - restart-ask-stack

concurrency:
  group: ops-vps
  cancel-in-progress: false

jobs:
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Run on VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 40m
          script: |
            set -euo pipefail
            cd /opt/gamehot
            OP='${{ inputs.script }}'
            # Host publishes web on $PORT from .env (often 80); do not trust unset shell PORT.
            HOST_PORT=$(grep -E '^PORT=' .env | head -1 | cut -d= -f2- || true)
            HOST_PORT=${HOST_PORT:-80}
            echo "=== op=$OP host=$(hostname) host_port=$HOST_PORT ==="
            echo "=== git ==="
            git rev-parse --short HEAD || true
            git log -1 --oneline || true
            echo "=== compose ps ==="
            sudo docker compose ps
            echo "=== env flags (redacted) ==="
            grep -E '^(MODEL_CALLS_ENABLED|COLLECT_ENABLED|SITE_URL|PORT|TRUST_PROXY)=' .env || true
            if grep -qE '^(LLM_|OPENAI_|ANTHROPIC_).*(KEY|TOKEN)=' .env; then echo "MODEL_KEY: present"; else echo "MODEL_KEY: missing-or-unmatched"; fi

            diagnose() {
              echo "=== api health ==="
              curl -sS -m 10 "http://127.0.0.1:${HOST_PORT}/api/health" || true
              echo
              echo "=== ask session create ==="
              curl -sS -m 15 -X POST "http://127.0.0.1:${HOST_PORT}/api/ask/sessions" -H 'content-type: application/json' -d '{}' || true
              echo
              echo "=== recent api/worker logs ==="
              sudo docker compose logs --tail=80 api worker 2>&1 | tail -120 || true
              echo "=== DB: valorant sources / pubs / topic pool ==="
              sudo docker compose exec -T db psql -U aihot -d aihot -v ON_ERROR_STOP=1 <<'SQL'
            SELECT id, name, enabled, health, last_ok_at, left(coalesce(last_error,''), 160) AS last_error
              FROM sources
             WHERE id IN ('json-val-news','web-playvalorant-news')
             ORDER BY id;
            SELECT s.id AS source_id, count(a.id) AS articles
              FROM sources s
              LEFT JOIN articles a ON a.source_id = s.id
             WHERE s.id IN ('json-val-news','web-playvalorant-news')
             GROUP BY s.id
             ORDER BY s.id;
            SELECT s.id AS source_id, count(p.id) AS publications
              FROM sources s
              LEFT JOIN articles a ON a.source_id = s.id
              LEFT JOIN publications p ON p.article_id = a.id
             WHERE s.id IN ('json-val-news','web-playvalorant-news')
             GROUP BY s.id
             ORDER BY s.id;
            SELECT count(*) AS pubs_title_hit
              FROM publications p
             WHERE p.title ILIKE '%无畏%' OR p.title ILIKE '%valorant%' OR p.title ILIKE '%VALORANT%' OR p.title ILIKE '%打瓦%';
            SQL
            }

            collect_valorant() {
              echo "=== one-shot collect json-val-news web-playvalorant-news ==="
              sudo docker compose run --rm --no-deps worker \
                node scripts/collect.ts json-val-news web-playvalorant-news
              echo "=== post-collect counts ==="
              sudo docker compose exec -T db psql -U aihot -d aihot -c \
                "SELECT s.id, count(a.id) AS articles FROM sources s LEFT JOIN articles a ON a.source_id=s.id WHERE s.id IN ('json-val-news','web-playvalorant-news') GROUP BY s.id ORDER BY s.id;"
              sudo docker compose exec -T db psql -U aihot -d aihot -c \
                "SELECT s.id, count(p.id) AS pubs FROM sources s LEFT JOIN articles a ON a.source_id=s.id LEFT JOIN publications p ON p.article_id=a.id WHERE s.id IN ('json-val-news','web-playvalorant-news') GROUP BY s.id ORDER BY s.id;"
            }

            restart_ask() {
              echo "=== restart api worker web ==="
              sudo docker compose up -d api worker web
              sleep 5
              sudo docker compose ps
              curl -sS -m 10 "http://127.0.0.1:${HOST_PORT}/api/health" || true
              echo
            }

            case "$OP" in
              diagnose) diagnose ;;
              collect-valorant) collect_valorant ;;
              diagnose-and-collect-valorant) diagnose; collect_valorant; diagnose ;;
              restart-ask-stack) restart_ask; diagnose ;;
              *) echo "unknown op"; exit 1 ;;
            esac
            echo "=== done ==="
