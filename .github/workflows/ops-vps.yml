# One-off / manual VPS ops via the same SSH secrets as Deploy.
# Does not overwrite .env. Keep COLLECT_ENABLED=false in .env; one-shot collect runs in-container only.
name: Ops VPS

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Preset op to run"
        required: true
        type: choice
        options:
          - diagnose
          - collect-valorant
          - diagnose-and-collect-valorant
          - restart-ask-stack

concurrency:
  group: ops-vps
  cancel-in-progress: false

jobs:
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Run on VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 40m
          script: |
            set -euo pipefail
            cd /opt/gamehot
            OP='${{ inputs.script }}'
            echo "=== op=$OP host=$(hostname) ==="
            echo "=== git ==="
            git rev-parse --short HEAD || true
            git log -1 --oneline || true
            echo "=== compose ps ==="
            sudo docker compose ps
            echo "=== env flags (redacted) ==="
            grep -E '^(MODEL_CALLS_ENABLED|COLLECT_ENABLED|SITE_URL|PORT|TRUST_PROXY)=' .env | sed 's/\(KEY\|TOKEN\|SECRET\|PASSWORD\)=.*/\1=***/' || true
            # Never print secrets
            if grep -qE '^(LLM_|OPENAI_|ANTHROPIC_).*(KEY|TOKEN)=' .env; then echo "MODEL_KEY: present"; else echo "MODEL_KEY: missing-or-unmatched"; fi

            diagnose() {
              echo "=== api health ==="
              curl -sS -m 10 http://127.0.0.1:${PORT:-3000}/api/health || curl -sS -m 10 http://127.0.0.1:3000/api/health || true
              echo
              echo "=== ask session create ==="
              curl -sS -m 15 -X POST http://127.0.0.1:${PORT:-3000}/api/ask/sessions -H 'content-type: application/json' -d '{}' || true
              echo
              echo "=== recent api/worker logs ==="
              sudo docker compose logs --tail=120 api worker 2>&1 | tail -160 || true
              echo "=== DB: valorant entity/topic/pubs ==="
              sudo docker compose exec -T db psql -U aihot -d aihot -v ON_ERROR_STOP=1 <<'SQL'
            SELECT id, name FROM entities WHERE id = 'valorant';
            SELECT slug, name, entity_id FROM topics WHERE slug = 'valorant' OR entity_id = 'valorant';
            SELECT id, enabled, last_success_at, last_error FROM sources WHERE id IN ('json-val-news','web-playvalorant-news');
            SELECT s.id AS source_id, count(p.id) AS pubs
              FROM sources s
              LEFT JOIN publications p ON p.source_id = s.id
             WHERE s.id IN ('json-val-news','web-playvalorant-news')
             GROUP BY s.id;
            SELECT count(*) AS pubs_mentioning_valorant
              FROM publications p
             WHERE p.title ILIKE '%无畏%' OR p.title ILIKE '%valorant%' OR p.title ILIKE '%VALORANT%' OR p.title ILIKE '%打瓦%';
            SELECT count(*) AS entity_links FROM publication_entities WHERE entity_id = 'valorant';
            SELECT count(*) AS selected_for_valorant
              FROM selections sel
              JOIN publications p ON p.id = sel.publication_id
              JOIN publication_entities pe ON pe.publication_id = p.id
             WHERE pe.entity_id = 'valorant' AND sel.selected = true;
            SQL
            }

            collect_valorant() {
              echo "=== one-shot collect json-val-news web-playvalorant-news (COLLECT_ENABLED stays as in .env) ==="
              # Run inside worker/api image with same env; force collect via script
              sudo docker compose run --rm --no-deps worker \
                node scripts/collect.ts json-val-news web-playvalorant-news
              echo "=== post-collect counts ==="
              sudo docker compose exec -T db psql -U aihot -d aihot -c \
                "SELECT s.id, count(p.id) AS pubs FROM sources s LEFT JOIN publications p ON p.source_id=s.id WHERE s.id IN ('json-val-news','web-playvalorant-news') GROUP BY s.id;"
              # Optionally kick selection/enrichment if needed — print entity links
              sudo docker compose exec -T db psql -U aihot -d aihot -c \
                "SELECT count(*) AS entity_links FROM publication_entities WHERE entity_id='valorant';"
            }

            restart_ask() {
              echo "=== restart api worker web ==="
              sudo docker compose up -d api worker web
              sleep 5
              sudo docker compose ps
              curl -sS -m 10 http://127.0.0.1:${PORT:-3000}/api/health || true
              echo
            }

            case "$OP" in
              diagnose) diagnose ;;
              collect-valorant) collect_valorant ;;
              diagnose-and-collect-valorant) diagnose; collect_valorant; diagnose ;;
              restart-ask-stack) restart_ask; diagnose ;;
              *) echo "unknown op"; exit 1 ;;
            esac
            echo "=== done ==="
